<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Zl존의 사생활 | Zl존여은 컴퍼니</title>
<meta name="description" content="백여은의 사진과 생각을 남기는 기록장입니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --bg-soft: #f6f5f3; --ink: #151515; --ink-soft: #8b8b8b;
    --line: #e4e2de; --accent: #8b8b8b; --card: #f6f5f3;
    --serif: "Noto Serif KR", "Nanum Myeongjo", serif;
    --sans: "Pretendard", -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  .nav .name { font-weight: 400 !important; letter-spacing: 0.16em !important; }
  .nav nav { font-size: 13px !important; letter-spacing: 0.06em; }
  .intro h1, .post h1 { font-weight: 300 !important; }
  .filters button { border-radius: 0 !important; }
  .tile { border-color: transparent !important; }
  .tile.text:hover { background: var(--ink); color: #fff; }
  .tile.text:hover .m, .tile.text:hover .m b { color: #cfcfcf; }
  .post .text p { color: #353535; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.75; word-break: keep-all; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

  header.nav { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .nav .name { font-family: var(--serif); font-weight: 600; font-size: 18px; text-decoration: none; letter-spacing: 0.02em; white-space: nowrap; }
  .nav nav { display: flex; gap: 26px; font-size: 14.5px; white-space: nowrap; }
  .nav nav a { text-decoration: none; color: var(--ink-soft); transition: color .2s; }
  .nav nav a:hover, .nav nav a.here { color: var(--ink); }

  /* 목록 화면 */
  .intro { padding-top: 84px; padding-bottom: 40px; }
  .eyebrow { font-size: 14px; letter-spacing: 0.18em; color: var(--accent); margin: 0 0 20px; }
  .intro h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(32px, 5vw, 52px); line-height: 1.3; letter-spacing: -0.02em; margin: 0 0 16px; }
  .intro p { color: var(--ink-soft); margin: 0; max-width: 560px; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 0 28px; }
  .filters button { font: inherit; font-size: 14px; color: var(--ink-soft); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; cursor: pointer; transition: all .2s; }
  .filters button:hover { color: var(--ink); border-color: var(--ink-soft); }
  .filters button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding-bottom: 96px; }
  .tile { position: relative; display: block; aspect-ratio: 1; overflow: hidden; background: var(--card); border: 1px solid var(--line); text-decoration: none; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s ease; }
  .tile:hover img { transform: scale(1.03); }
  .tile .more { position: absolute; top: 12px; right: 12px; font-size: 12px; background: rgba(0,0,0,.55); color: #fff; padding: 2px 9px; border-radius: 999px; }
  .tile .stamp { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; display: flex; justify-content: space-between; padding: 34px 16px 12px; font-size: 13px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.55)); }
  .tile .stamp b { font-weight: 400; }
  .tile .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 16px 40px; color: #fff; font-size: 14px; line-height: 1.5; background: linear-gradient(transparent, rgba(0,0,0,.6)); opacity: 0; transition: opacity .3s; }
  .tile:hover .cap, .tile:focus-visible .cap { opacity: 1; }
  .tile.text { display: flex; flex-direction: column; justify-content: space-between; padding: 26px 26px 22px; transition: border-color .2s; }
  .tile.text:hover { border-color: var(--accent); }
  .tile.text .t { font-family: var(--serif); font-weight: 500; font-size: clamp(17px, 2.1vw, 23px); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .tile.text .m { font-size: 13px; color: var(--ink-soft); display: flex; justify-content: space-between; }
  .tile.text .m b { font-weight: 400; color: var(--accent); }
  .empty { grid-column: 1 / -1; color: var(--ink-soft); padding: 40px 0; }

  /* 글 한 편 화면 */
  .post { max-width: 720px; margin: 0 auto; padding: 56px 24px 110px; }
  .back { display: inline-block; font-size: 14px; color: var(--ink-soft); text-decoration: none; margin-bottom: 44px; }
  .back:hover { color: var(--ink); }
  .post .meta { font-size: 14px; letter-spacing: 0.06em; color: var(--accent); margin-bottom: 12px; }
  .post h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(28px, 4.4vw, 42px); line-height: 1.4; letter-spacing: -0.01em; margin: 0 0 40px; }
  .post .photos { display: grid; gap: 14px; margin-bottom: 40px; }
  .post .photos img { width: 100%; display: block; border-radius: 2px; }
  .post .photos video { width: 100%; max-height: 82vh; display: block; background: #111; }
  .post .text p { margin: 0 0 22px; font-size: 18px; line-height: 1.95; white-space: pre-line; }
  .ph { display: inline-block; max-width: 100%; }
  .pager { display: flex; justify-content: space-between; gap: 20px; margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--line); font-size: 14.5px; }
  .pager a { text-decoration: none; color: var(--ink-soft); max-width: 46%; }
  .pager a:hover { color: var(--ink); }
  .pager a span { display: block; font-size: 12.5px; color: var(--accent); }
  .pager a.next { text-align: right; margin-left: auto; }

  footer { border-top: 1px solid var(--line); padding: 32px 0 44px; font-size: 13.5px; color: var(--ink-soft); }

  @media (max-width: 820px) {
    body { font-size: 16px; }
    .wrap { padding: 0 20px; }
    .nav .name { font-size: 16px; }
    .nav nav { gap: 14px; font-size: 13.5px; }
    .nav nav a.opt { display: none; }
    .intro { padding-top: 56px; padding-bottom: 28px; }
    .grid { gap: 6px; padding-bottom: 64px; }
    .tile.text { padding: 12px 12px 10px; }
    .tile.text .t { font-size: 13.5px; -webkit-line-clamp: 4; }
    .tile.text .m { font-size: 10.5px; }
    .tile.text .m b { display: none; }
    .tile .cap { display: none; }
    .post { padding: 36px 20px 72px; }
    .post .text p { font-size: 17px; }
  }
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a class="name" href="index.html">Zl존여은 컴퍼니</a>
    <nav>
      <a href="index.html">카테고리</a>
      <a class="opt" href="index.html#portfolio">포트폴리오</a>
      <a class="opt" href="index.html#ceo">대표실</a>
      <a class="opt" href="index.html#marketing">마케팅</a>
      <a class="opt" href="index.html#lab">연구소</a>
      <a class="opt" href="index.html#newbiz">신사업</a>
      <a class="opt" href="index.html#realestate">부동산</a>
      <a class="opt" href="index.html#taste">취향</a>
      <a class="here" href="journal.html">사생활</a>
      <a href="index.html#contact">연락</a>
    </nav>
  </div>
</header>

<main>
  <!-- 목록 -->
  <div id="list">
    <div class="wrap intro">
      <p class="eyebrow">07 — PRIVATE LIFE · Zl존의 사생활</p>
      <h1>보고, 생각하고, 기록합니다.</h1>
      <p>일 밖의 순간과 그날의 생각을 기록합니다.</p>
    </div>
    <div class="wrap">
      <div class="filters" id="filters"></div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <!-- 글 한 편 -->
  <article class="post" id="post" hidden>
    <a class="back" href="#">← Zl존의 사생활 전체 보기</a>
    <div class="meta" id="p-meta"></div>
    <h1 id="p-title"></h1>
    <div class="photos" id="p-photos"></div>
    <div class="text" id="p-text"></div>
    <div class="pager" id="p-pager"></div>
  </article>
</main>

<footer>
  <div class="wrap">© 2026 Zl존여은 컴퍼니 · 백여은</div>
</footer>

<script src="posts.js"></script>
<script>
  var PHOTO_DIR = "assets/journal/";
  var posts = (window.POSTS || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  posts.forEach(function (p, i) { p.photos = p.photos || []; p.id = p.date + "-" + (posts.length - i); });
  var current = "전체";

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function niceDate(d) { var a = d.split("-"); return a[0] + ". " + Number(a[1]) + ". " + Number(a[2]) + "."; }

  function drawFilters() {
    var box = document.getElementById("filters");
    var tags = ["전체"];
    posts.forEach(function (p) { if (p.tag && tags.indexOf(p.tag) < 0) tags.push(p.tag); });
    box.innerHTML = "";
    if (tags.length < 3) return;   // 분류가 하나뿐이면 버튼을 숨깁니다
    tags.forEach(function (t) {
      var b = el("button", t === current ? "on" : "", t);
      b.onclick = function () { current = t; drawFilters(); drawGrid(); };
      box.appendChild(b);
    });
  }

  function drawGrid() {
    var grid = document.getElementById("grid");
    grid.innerHTML = "";
    var shown = posts.filter(function (p) { return current === "전체" || p.tag === current; });
    if (!shown.length) { grid.appendChild(el("p", "empty", "아직 올린 기록이 없습니다.")); return; }
    shown.forEach(function (p) {
      var a = el("a", "tile");
      a.href = "#" + p.id;
      if (p.photos.length) {
        var img = el("img");
        img.src = PHOTO_DIR + p.photos[0];
        img.alt = p.title;
        img.loading = "lazy";
        a.appendChild(img);
        if (p.photos.length > 1) a.appendChild(el("span", "more", "+" + (p.photos.length - 1)));
        if (p.focus) img.style.objectPosition = p.focus;   // 대표 사진에서 보여 줄 중심 위치
        a.appendChild(el("span", "cap", p.title));
        var st = el("span", "stamp");
        st.appendChild(el("span", "", niceDate(p.date)));
        st.appendChild(el("b", "", p.tag || ""));
        a.appendChild(st);
      } else {
        a.classList.add("text");
        a.appendChild(el("span", "t", p.title));
        var m = el("span", "m");
        m.appendChild(el("span", "", niceDate(p.date)));
        m.appendChild(el("b", "", p.tag || ""));
        a.appendChild(m);
      }
      grid.appendChild(a);
    });
  }

  // 글을 뜻 단위로 줄바꿈: 쉼표, 문장 끝, 글 속의 | 표시에서만 줄이 바뀝니다 (| 는 화면에 보이지 않습니다)
  function chunk(root) {
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [], n;
    while ((n = w.nextNode())) nodes.push(n);
    nodes.forEach(function (t) {
      var s = t.nodeValue;
      if (!s.trim()) return;
      var f = document.createDocumentFragment();
      s.trim().split("\n").forEach(function (line, li) {
        if (li) f.appendChild(document.createElement("br"));
        var first = true;
        line.replace(/([,.!?][”"’']?)[ \t]+/g, "$1|").split("|").forEach(function (part) {
          if (!part.trim()) return;
          if (!first) f.appendChild(document.createTextNode(" "));
          var sp = document.createElement("span");
          sp.className = "ph"; sp.textContent = part.trim();
          f.appendChild(sp); first = false;
        });
      });
      t.parentNode.replaceChild(f, t);
    });
  }

  function drawPost(p) {
    document.getElementById("p-meta").textContent = niceDate(p.date) + (p.tag ? "  ·  " + p.tag : "");
    document.getElementById("p-title").textContent = p.title;
    var ph = document.getElementById("p-photos");
    ph.innerHTML = "";
    p.photos.forEach(function (f) {
      if (/\.(mp4|webm)$/i.test(f)) {   // 영상 파일은 재생 화면으로
        var v = el("video"); v.src = PHOTO_DIR + f; v.controls = true; v.muted = true; v.loop = true; v.playsInline = true; v.preload = "metadata";
        ph.appendChild(v);
      } else {
        var img = el("img"); img.src = PHOTO_DIR + f; img.alt = p.title; ph.appendChild(img);
      }
    });
    ph.hidden = !p.photos.length;
    var tx = document.getElementById("p-text");
    tx.innerHTML = "";
    (p.body || "").trim().split(/\n\s*\n/).forEach(function (para) { if (para.trim()) { var pe = el("p", "", para.trim()); chunk(pe); tx.appendChild(pe); } });
    var pg = document.getElementById("p-pager");
    pg.innerHTML = "";
    var i = posts.indexOf(p);
    var newer = posts[i - 1], older = posts[i + 1];
    if (older) { var o = el("a", "prev"); o.href = "#" + older.id; o.appendChild(el("span", "", "이전 글")); o.appendChild(document.createTextNode(older.title)); pg.appendChild(o); }
    if (newer) { var n = el("a", "next"); n.href = "#" + newer.id; n.appendChild(el("span", "", "다음 글")); n.appendChild(document.createTextNode(newer.title)); pg.appendChild(n); }
    pg.hidden = !older && !newer;
    document.title = p.title + " | Zl존여은 컴퍼니";
  }

  function route() {
    var id = decodeURIComponent(location.hash.slice(1));
    var p = posts.filter(function (x) { return x.id === id; })[0];
    document.getElementById("list").hidden = !!p;
    document.getElementById("post").hidden = !p;
    if (p) drawPost(p); else document.title = "Zl존의 사생활 | Zl존여은 컴퍼니";
    window.scrollTo(0, 0);
  }

  drawFilters();
  drawGrid();
  route();
  window.addEventListener("hashchange", route);
</script>
</body>
</html>
